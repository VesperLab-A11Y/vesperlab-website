<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Applique thème et taille de texte enregistrés AVANT le premier rendu, pour
     éviter un flash au chargement. Le reste (écouteurs de clic, etc.) est dans
     assets/js/site.js, chargé en defer. -->
<script>
(function () {
  document.documentElement.classList.add('js');
  try {
    var t = localStorage.getItem('vl-theme');
    if (t && t !== 'dark') document.documentElement.setAttribute('data-theme', t);
    var f = localStorage.getItem('vl-font-step');
    if (f && f !== '0') document.documentElement.classList.add('vl-font-' + (f > 0 ? f : '-' + Math.abs(f)));
  } catch (e) {}
})();
</script>

<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://vesperlab.dev{{path}}">
<meta name="theme-color" content="#030504">

<!-- Versions linguistiques réciproques -->
<link rel="alternate" hreflang="fr" href="https://vesperlab.dev{{pathFr}}">
<link rel="alternate" hreflang="en" href="https://vesperlab.dev{{pathEn}}">
<link rel="alternate" hreflang="x-default" href="https://vesperlab.dev{{pathFr}}">

<!-- Open Graph / partage -->
<meta property="og:type" content="website">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:url" content="https://vesperlab.dev{{path}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="https://vesperlab.dev/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">

<!-- Favicons -->
<link rel="icon" href="/assets/favicon-16.svg" sizes="16x16">
<link rel="icon" href="/assets/favicon.svg" sizes="any">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<!-- Préchargement des deux faces du premier rendu -->
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/noto-serif-latin-600.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/noto-sans-latin-400.woff2" crossorigin>

<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/style.css">
</head>
<body class="page-{{pageKey}}">

<!-- Lune fixe (immobile à l'écran) + voile : voir la section "Lune fixe" de
     style.css. Décoratif, aria-hidden, ne doit jamais capter le focus/clic. -->
<div class="moon-fixed" aria-hidden="true">
  <div class="moon"><img class="moon-photo" src="/assets/img/moon.jpg" alt=""><div class="moon-shadow"></div></div>
</div>
<div class="page-scrim" aria-hidden="true"></div>

<a class="skip-link" href="#main">{{i18n.skipLink}}</a>

{{> header}}

<main id="main" tabindex="-1">
{{main}}
</main>

{{> footer}}

<script defer src="/assets/js/site.js"></script>
<script defer src="/assets/js/moon.js"></script>
<script defer src="/assets/js/apropos.js"></script>
</body>
</html>
