<!-- En-tête : logo, nav 5 entrées (LAB = lien + sous-menu), bascule de langue,
     bouton « options d'accessibilité », burger mobile. Le fondu au scroll et
     l'ouverture des menus sont pilotés par assets/js/header.js (progressive
     enhancement : sans JS, tout reste visible et cliquable). -->
<header class="mp-header" id="site-header">
 <div class="mp-header-inner">
  <a class="site-logo" href="{{home}}" aria-label="{{i18n.logoAria}}">
    {{inline:assets/vesperlab-logo.svg}}
  </a>

  <button type="button" class="nav-burger" id="nav-burger" aria-expanded="false" aria-controls="nav-panel">
    <svg class="icon-burger" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="visually-hidden" data-open-label="{{i18n.navBurgerOpen}}" data-close-label="{{i18n.navBurgerClose}}">{{i18n.navBurgerOpen}}</span>
  </button>

  <div class="nav-panel" id="nav-panel">
    <nav class="site-nav" aria-label="{{i18n.navAria}}">
      <ul>
        <li><a href="{{home}}"{{aria.accueil}}>{{i18n.navAccueil}}</a></li>
        <li><a href="{{nav.apropos}}"{{aria.apropos}}>{{i18n.navApropos}}</a></li>
        <li class="nav-lab">
          <span class="nav-lab-row">
            <a href="{{nav.lelab}}"{{aria.lelab}}>{{i18n.navLeLab}}</a>
            <button type="button" class="lab-toggle" id="lab-toggle" aria-expanded="false" aria-controls="lab-submenu">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
              <span class="visually-hidden">{{i18n.navLabToggle}}</span>
            </button>
          </span>
        </li>
        <li><a href="{{nav.contact}}"{{aria.contact}}>{{i18n.navContact}}</a></li>
      </ul>
      <ul class="lab-submenu" id="lab-submenu">
        <li><a href="{{nav.lelab-outils}}"{{aria.lelab-outils}}>{{i18n.navLabTools}}</a></li>
        <li><a href="{{nav.lelab-realisations}}"{{aria.lelab-realisations}}>{{i18n.navLabPortfolio}}</a></li>
        <li><a href="{{nav.blog}}"{{aria.blog}}>{{i18n.navBlog}}</a></li>
      </ul>
    </nav>

    <div class="header-tools">
      <a class="lang-switch" href="{{langToggleHref}}" lang="{{langToggleLang}}" hreflang="{{langToggleLang}}">{{langToggleLang}}</a>
      <a class="a11y-options-link" href="#a11y-options" aria-label="{{i18n.a11yOptionsAria}}">
        {{inline:assets/icons/a11y-options.svg}}
      </a>
    </div>
  </div>
 </div>
</header>
